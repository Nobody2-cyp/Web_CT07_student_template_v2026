<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Star Defender</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <h1>Star Defender</h1>
        <a href="/" class="home-link">Back to game hub</a>
      </header>

      <main class="game-panel">
        <canvas id="gameCanvas" width="900" height="600" aria-label="Space shooter game canvas"></canvas>
        <div class="hud">
          <div>Score: <span id="score">0</span></div>
          <div>Lives: <span id="lives">5</span></div>
          <div>Best: <span id="best">0</span></div>
        </div>
      </main>

      <div class="controls">
        <p>Move: A / D or ← / →</p>
        <p>Shoot: Space or click</p>
        <button id="restartButton">Restart</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
